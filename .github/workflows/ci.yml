name: CI Code Quality Check

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Validate sources.json Syntax
        run: python -m json.tool sources.json > /dev/null

      - name: Run Unit Tests
        run: python -m unittest discover -s tests -v

      - name: Lint Python Code (Ruff)
        run: |
          pip install ruff
          ruff check build.py tests

      - name: Lint Shell Scripts (ShellCheck)
        uses: ludeeus/action-shellcheck@master
        with:
          scans: setup.sh
