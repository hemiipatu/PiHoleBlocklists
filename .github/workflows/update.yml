name: Update Blocklists and Create Release

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  push:
    branches:
      - main
    paths:
      - 'sources.json'
      - 'whitelist.txt'
      - 'config/**'
      - 'build.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run Build Script
        run: python build.py

      - name: Commit and Push Updated Blocklists & Sanitized Whitelist
        id: git_commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add blocklists/ whitelist.txt
          
          if git diff --staged --quiet; then
            echo "CHANGED=false" >> $GITHUB_OUTPUT
            echo "No blocklist or whitelist changes detected."
          else
            git commit -m "Auto-update blocklists and sanitize whitelist [skip ci]"
            git push
            echo "CHANGED=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate Version Tag
        if: steps.git_commit.outputs.CHANGED == 'true' || github.event_name == 'workflow_dispatch'
        id: versioning
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "TAG_NAME=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated release tag: $VERSION"

      # 1. Create Versioned GitHub Release (e.g., v1.0.42)
      - name: Create Versioned GitHub Release
        if: steps.git_commit.outputs.CHANGED == 'true' || github.event_name == 'workflow_dispatch'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.versioning.outputs.TAG_NAME }}
          name: "Release ${{ steps.versioning.outputs.TAG_NAME }}"
          bodyFile: "build_summary.md"
          artifacts: "blocklists/basic.txt,blocklists/balanced.txt,blocklists/ultimate.txt,blocklists/sha256sums.txt,whitelist.txt"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Update Fixed 'latest' Alias Release for Static User Links
      - name: Update 'latest' Alias Release
        if: steps.git_commit.outputs.CHANGED == 'true' || github.event_name == 'workflow_dispatch'
        uses: ncipollo/release-action@v1
        with:
          tag: "latest"
          name: "Latest Release (${{ steps.versioning.outputs.TAG_NAME }})"
          bodyFile: "build_summary.md"
          artifacts: "blocklists/basic.txt,blocklists/balanced.txt,blocklists/ultimate.txt,blocklists/sha256sums.txt,whitelist.txt"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}
