name: Update Blocklists and Create Release

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
    paths:
      - 'sources.json'
      - 'whitelist.txt'
      - 'config/**'
      - 'build.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run Build Script
        run: python build.py

      - name: Commit and Push Updated Blocklists
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add blocklists/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update blocklists [skip ci]" && git push)

      # Create or Update a 'latest' Release with Attached Files
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: "latest"
          name: "Latest Blocklists Build"
          body: |
            Automated build of Basic, Balanced, and Ultimate blocklist tiers.
            Updated automatically via GitHub Actions.
          artifacts: "blocklists/*.txt,whitelist.txt"
          allowUpdates: true
          recreate: true
          token: ${{ secrets.GITHUB_TOKEN }}
