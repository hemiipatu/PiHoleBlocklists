name: Upstream Source Health Check

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-health:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate Upstream HTTP Endpoints
        id: health_check
        run: |
          python -c "
          import json, urllib.request, os

          SOURCES_FILE = 'sources.json'
          if not os.path.exists(SOURCES_FILE):
              print('::error::sources.json not found!')
              exit(1)

          with open(SOURCES_FILE, 'r', encoding='utf-8') as f:
              data = json.load(f)

          failed_sources = []
          total_checked = 0
          headers = {'User-Agent': 'Mozilla/5.0 (BlocklistHealthCheck/1.0)'}

          print('Starting upstream URL HTTP health checks...\n')

          for tier, categories in data.items():
              for category, urls in categories.items():
                  for url in urls:
                      total_checked += 1
                      try:
                          req = urllib.request.Request(url, headers=headers, method='HEAD')
                          with urllib.request.urlopen(req, timeout=12) as response:
                              if response.status not in (200, 301, 302):
                                  failed_sources.append((str(tier), str(category), str(url), f'HTTP Status {response.status}'))
                      except Exception as e:
                          try:
                              req = urllib.request.Request(url, headers=headers)
                              with urllib.request.urlopen(req, timeout=12) as response:
                                  if response.status not in (200, 301, 302):
                                      failed_sources.append((str(tier), str(category), str(url), f'HTTP Status {response.status}'))
                          except Exception as retry_e:
                              err_msg = str(retry_e).replace('|', '-').replace('\n', ' ')
                              failed_sources.append((str(tier), str(category), str(url), err_msg))

          print(f'Done. Checked {total_checked} upstream URLs.')

          if failed_sources:
              print(f'Found {len(failed_sources)} failing upstream sources.')
              
              report = []
              report.append('### ⚠️ Upstream Source Health Check Failures\n')
              report.append(f'The scheduled health check detected **{len(failed_sources)}** unreachable or failing upstream sources out of **{total_checked}** total feeds.\n')
              report.append('| Tier | Category | Failing URL | Error / Status |')
              report.append('| :--- | :--- | :--- | :--- |')
              
              for tier, cat, url, err in failed_sources:
                  report.append(f'| **{tier.capitalize()}** | `{cat}` | {url} | `{err}` |')

              report.append('\n*Please verify if these URLs are permanently offline and require removal from `sources.json`.*')
              
              full_markdown = '\n'.join(report)

              with open('health_report.md', 'w', encoding='utf-8') as rf:
                  rf.write(full_markdown)

              with open(os.environ['GITHUB_OUTPUT'], 'a') as env_out:
                  env_out.write('FAILED=true\n')
                  env_out.write(f'FAIL_COUNT={len(failed_sources)}\n')
          else:
              print('All upstream sources are healthy and reachable!')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as env_out:
                  env_out.write('FAILED=false\n')
          "

      - name: Create Issue on Health Check Failure
        if: steps.health_check.outputs.FAILED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportBody = fs.readFileSync('health_report.md', 'utf8');

            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['broken-source', 'automated']
            });

            if (existingIssues.data.length > 0) {
              const issueNumber = existingIssues.data[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `**Update:** Weekly health check still detecting issues:\n\n` + reportBody
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ [Source Health]: Unreachable Upstream Blocklists Detected',
                body: reportBody,
                labels: ['broken-source', 'automated']
              });
            }
