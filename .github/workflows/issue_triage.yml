name: Auto Triage False Positive Issues

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Process False Positive Issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";

            // Check if the issue title starts with "[False Positive]:" or contains the false-positive label
            const isFalsePositive = issue.title.startsWith("[False Positive]:") || 
                                    issue.labels.some(l => l.name === "false-positive");

            if (!isFalsePositive) {
              console.log("Not a false positive issue. Skipping.");
              return;
            }

            // Extract the domain from the issue template form field
            // Looking for text immediately after "### Blocked Domain(s)"
            const domainMatch = body.match(/### Blocked Domain\(s\)\s*\n+([^\n\r]+)/i);
            const domain = domainMatch ? domainMatch[1].trim() : "Not specified";

            // Add triage labels to the issue
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['false-positive', 'needs-triage']
            });

            // Post an automated confirmation comment
            const commentBody = `### 🤖 Automated Triage Confirmation\n\n` +
              `Thank you for reporting this issue!\n\n` +
              `* **Target Domain:** \`${domain}\`\n` +
              `* **Status:** Queued for verification against \`sources.json\` and \`whitelist.txt\`.\n\n` +
              `A maintainer will review this request shortly. If verified, the domain will be added to the dynamic whitelist in the next build run.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: commentBody
            });
